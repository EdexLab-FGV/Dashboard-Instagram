name: Coletar dados e publicar dashboard

on:
  schedule:
    # A cada 6 horas (horário UTC). Minuto 17 para evitar o pico das :00.
    - cron: "17 */6 * * *"
  workflow_dispatch: # botão "Run workflow" para rodar na hora
  push:
    branches: [main]
    paths:
      - "index.html"
      - "anuncios.html"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta-instagram
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    env:
      AD_ACCOUNT_ID: ${{ secrets.AD_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências
        if: github.event_name != 'push'
        run: pip install --quiet cryptography

      - name: Coletar dados do Instagram
        if: github.event_name != 'push'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 scripts/collect.py

      - name: Coletar dados de anúncios
        # só roda se o secret AD_ACCOUNT_ID existir; se falhar, o painel do Instagram é publicado mesmo assim
        if: github.event_name != 'push' && env.AD_ACCOUNT_ID != ''
        continue-on-error: true
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        run: python3 scripts/collect_ads.py

      - name: Salvar dados no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Sem mudanças nos dados."
          else
            git commit -m "dados: coleta $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empacotar o site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
